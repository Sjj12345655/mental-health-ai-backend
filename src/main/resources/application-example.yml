# ============================================================
# 配置模板（使用方法）：
# 1. 复制本文件，同目录下粘贴并重命名为 application.yml
# 2. 在 application.yml 中填入你自己的数据库密码和 API 密钥
# 3. application.yml 已在 .gitignore 中忽略，不会被提交到仓库
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai-anli?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 替换为你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Spring AI / OpenAI 兼容配置（本项目接入硅基流动 SiliconFlow）
  ai:
    openai:
      api-key: sk-替换为你的硅基流动API密钥
      base-url: https://api.siliconflow.cn
      chat:
        completions-path: /v1/chat/completions
        options:
          model: deepseek-ai/DeepSeek-V3
          tool-calling:
            enabled: true
server:
  port: 8080


# JWT配置
jwt:
  secret: 替换为一段足够长的随机字符串
  expiration: 31536000000      # token有效期（毫秒），31536000000 = 一年
  refresh-expiration: 604800000 # 刷新token有效期（毫秒），604800000 = 7天
  header: Authorization         # token请求头名称
  token-prefix: "Bearer "       # token前缀
